[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "equity-screener"
version = "0.1.0"
description = "Configurable fundamental screens and heatmap of S&P 500 stocks, built from SEC filings with an audit trail"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6",
    "requests>=2.31",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "playwright>=1.40"]

[project.scripts]
equity-screener = "equity_screener.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
